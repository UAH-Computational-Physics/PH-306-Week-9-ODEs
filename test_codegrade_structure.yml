# Semgrep rules for the CodeGrade "Structure" category.
#
# Usage: split these rules across CodeGrade structure blocks by id.
#   - Positive match blocks (credit awarded when found), one per function so
#     that every function is independently required to earn credit:
#       required-solve-ivp-call-constant-acceleration-velocity
#       required-solve-ivp-call-time-dependent-force-velocity
#       required-solve-ivp-call-linear-drag-velocity
#       required-solve-ivp-call-rc-circuit-charging-voltage
#       required-solve-ivp-call-quadratic-drag-velocity
#       required-solve-ivp-call-logistic-population-growth
#       required-solve-ivp-call-damped-harmonic-oscillator
#       required-solve-ivp-call-pendulum-comparison
#   - Negative match block (credit deducted when found):
#       forbidden-hardcoded-success
#       forbidden-fabricated-result-object
#       forbidden-hardcoded-result-attributes
#
# Rationale: the public/private pytest suites only check attributes of the
# returned object (e.g. `sol.success`, `sol.y`, `sol.t`). A student could
# satisfy every functionality test by hand-computing the analytic answer
# and wrapping it in a fake object (e.g. `types.SimpleNamespace(success=True,
# y=..., t=t_eval)`) instead of calling `solve_ivp`. The positive rules below
# each require one specific function to call `solve_ivp`; a single shared
# rule id with a function-name regex would be satisfied as soon as any one
# function matched, letting the other seven skip integration entirely. The
# negative rules flag the most common ways to fabricate a passing result
# without calling solve_ivp.

rules:
  - id: required-solve-ivp-call-constant-acceleration-velocity
    languages: [python]
    severity: ERROR
    message: >
      REQUIRED: `constant_acceleration_velocity` must call solve_ivp to
      numerically integrate the ODE rather than hardcoding the result.
    patterns:
      - pattern: |
          def constant_acceleration_velocity(...):
              ...
              solve_ivp(...)
              ...

  - id: required-solve-ivp-call-time-dependent-force-velocity
