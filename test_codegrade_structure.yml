  - id: required-solve-ivp-call-pendulum-comparison
    languages: [python]
    severity: ERROR
    message: >
      REQUIRED: `pendulum_comparison` must call solve_ivp to numerically
      integrate both the small-angle and full nonlinear equations rather
      than hardcoding either result.
    patterns:
      - pattern: |
          def pendulum_comparison(...):
              ...
              solve_ivp(...)
              ...

  - id: forbidden-hardcoded-success
    languages: [python]
    severity: ERROR
    message: >
      FORBIDDEN: manually setting a `.success` attribute fakes a solve_ivp
      result instead of letting solve_ivp report success.
    patterns:
      - pattern-either:
          - pattern: $OBJ.success = True
          - pattern: $OBJ.success = $VAL

  - id: forbidden-fabricated-result-object
    languages: [python]
    severity: ERROR
    message: >
      FORBIDDEN: constructing a stand-in result object (OdeResult,
      OptimizeResult, SimpleNamespace, etc.) instead of returning the
      object produced by solve_ivp.
    patterns:
      - pattern-either:
          - pattern: OdeResult(...)
          - pattern: scipy.integrate.OdeResult(...)
          - pattern: OptimizeResult(...)
          - pattern: scipy.optimize.OptimizeResult(...)
          - pattern: SimpleNamespace(...)
          - pattern: types.SimpleNamespace(...)

  - id: forbidden-hardcoded-result-attributes
    languages: [python]
    severity: ERROR
    message: >
      FORBIDDEN: directly assigning `.y` or `.t` on an object bypasses
      solve_ivp and hardcodes the expected answer.
    patterns:
      - pattern-either:
          - pattern: $OBJ.y = ...
          - pattern: $OBJ.t = ...
